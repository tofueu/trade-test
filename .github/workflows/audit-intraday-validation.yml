name: Audit intraday OHLCV and drawdown regression

on:
  push:
    branches:
      - audit/trade-test-equity-dd-floor-20261027
    paths:
      - 'research/multi-market-strategy-ranking/src/run_intraday.py'
      - 'research/multi-market-strategy-ranking/tests/test_intraday.py'
      - '.github/workflows/audit-intraday-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install -r research/multi-market-strategy-ranking/requirements.txt
      - name: Compile changed modules
        run: python -m py_compile research/multi-market-strategy-ranking/src/run_intraday.py research/multi-market-strategy-ranking/tests/test_intraday.py
      - name: Run offline OHLCV, ranking, and bankruptcy regression tests
        run: python -m unittest discover -s research/multi-market-strategy-ranking/tests -p 'test_intraday.py' -v
