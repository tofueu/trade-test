name: Trade Test real BTCUSDT 4h and 1d five-year Python batch

on:
  push:
    branches:
      - audit/trade-test-equity-dd-floor-20261027
    paths:
      - '.github/workflows/trade-test-intraday-4h-1d.yml'

permissions:
  contents: write

concurrency:
  group: trade-test-real-btc-4h-1d
  cancel-in-progress: false

jobs:
  btcusdt-4h-1d-five-years:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r research/multi-market-strategy-ranking/requirements.txt
      - name: Verify intraday parser and checkpoint integrity before real data
        run: python -m unittest discover -s research/multi-market-strategy-ranking/tests -p 'test_intraday.py' -v
      - name: Run real BTCUSDT 4h five-year batch
        run: python research/multi-market-strategy-ranking/src/run_intraday.py --symbol BTCUSDT --timeframe 4h
      - name: Commit verified 4h ranking on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/multi-market-strategy-ranking/results/intraday/
          if ! git diff --cached --quiet; then
            git commit -m 'data: real BTCUSDT 4h five-year ranking [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run real BTCUSDT 1d five-year batch
        run: python research/multi-market-strategy-ranking/src/run_intraday.py --symbol BTCUSDT --timeframe 1d
      - name: Commit verified 1d ranking on isolated branch
        run: |
          git add research/multi-market-strategy-ranking/results/intraday/
          if ! git diff --cached --quiet; then
            git commit -m 'data: real BTCUSDT 1d five-year ranking [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
