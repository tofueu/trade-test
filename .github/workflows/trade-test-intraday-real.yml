name: Trade Test real five-year intraday Python batch

on:
  push:
    branches:
      - audit/tv-parity-fail-closed-20261025-11672690887494441388
    paths:
      - 'research/multi-market-strategy-ranking/src/run_intraday.py'
      - 'research/multi-market-strategy-ranking/tests/test_intraday.py'
      - '.github/workflows/trade-test-intraday-real.yml'

permissions:
  contents: write

concurrency:
  group: trade-test-intraday-btc-1h-30m
  cancel-in-progress: false

jobs:
  btcusdt-1h-30m-five-years:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install -r research/multi-market-strategy-ranking/requirements.txt
      - name: Verify archive parser, qualification and ranking persistence
        run: python -m unittest discover -s research/multi-market-strategy-ranking/tests -p 'test_intraday.py' -v
      - name: Run actual Binance USD-M BTCUSDT 1h five-year Python batch
        run: python research/multi-market-strategy-ranking/src/run_intraday.py --symbol BTCUSDT --timeframe 1h
      - name: Persist verified 1h results before 30m starts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/multi-market-strategy-ranking/results/intraday/
          if git diff --cached --quiet; then
            echo 'No changed ranking files'
            exit 0
          fi
          git commit -m 'data: corrected BTCUSDT 1h five-year ranking [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Run actual Binance USD-M BTCUSDT 30m five-year Python batch
        run: python research/multi-market-strategy-ranking/src/run_intraday.py --symbol BTCUSDT --timeframe 30m
      - name: Persist verified 30m results to this isolated PR branch
        run: |
          git add research/multi-market-strategy-ranking/results/intraday/
          if git diff --cached --quiet; then
            echo 'No changed 30m ranking files'
            exit 0
          fi
          git commit -m 'data: real BTCUSDT 30m five-year ranking [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
