name: Strategy Tests & Equivalence Checks

on:
  push:
    branches: [ main, pine-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r research/multi-market-strategy-ranking/requirements.txt
        pip install pytest pandas

    - name: Run Python regression tests
      run: |
        python -m pytest research/multi-market-strategy-ranking/tests/
