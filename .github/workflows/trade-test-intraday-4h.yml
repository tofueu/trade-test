name: Trade Test real BTCUSDT 4h five-year Python batch

on:
  push:
    branches:
      - audit/tv-parity-fail-closed-20261025-11672690887494441388
    paths:
      - '.github/workflows/trade-test-intraday-4h.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-test-intraday-btc-4h
  cancel-in-progress: false

jobs:
  btcusdt-4h-five-years:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install -r research/multi-market-strategy-ranking/requirements.txt
      - name: Verify intraday loader, 4h coverage and qualification regressions
        run: python -m unittest discover -s research/multi-market-strategy-ranking/tests -p 'test_intraday.py' -v
      - name: Run actual Binance USD-M BTCUSDT 4h five-year Python batch
        run: python research/multi-market-strategy-ranking/src/run_intraday.py --symbol BTCUSDT --timeframe 4h
      - name: Persist only real 4h ranking and provenance to isolated PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/multi-market-strategy-ranking/results/intraday/new_BTCUSDT_4h_five_year_*
          if git diff --cached --quiet; then
            echo 'No new verified 4h ranking files'
          else
            git commit -m 'data: real BTCUSDT 4h five-year ranking [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
